name: Windows workflow

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    name: build (windows-msvc)

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.event.pull_request.head.sha }}

      # ---- Toolchain ----
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      # ---- Qt ----
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.2"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"
          modules: qt5compat
          cache: true

      # ---- VCPKG Dependencies (simplified, no caching) ----
      - name: Setup and install vcpkg dependencies
        run: |
          Write-Host "Installing Qt6 base for vcpkg..."
          & vcpkg install qt6-base:x64-windows

          Write-Host "Installing OpenCV build-time dependencies..."

          $dependencies = @(
            'exiv2:x64-windows',
            'libraw:x64-windows',
            'vulkan-headers:x64-windows',
            'pkgconf:x64-windows',
            'tiff:x64-windows'
          )

          foreach ($dep in $dependencies) {
            Write-Host "Installing: $($dep)"
            & vcpkg install --triplet x64-windows $dep
          }

      - name: Fetch OpenCV source
        run: |
          Write-Host "Cloning OpenCV..."
          git clone --depth 1 -b 4.13.0 https://github.com/opencv/opencv.git opencv


      # ---- Clean before build ----
      - name: Clean stale artifacts
        run: |
          $workspace = "${{ github.workspace }}"

          Write-Host "Cleaning stale executables from opencv/build/bin..."
          if (Test-Path "$workspace\opencv\build\bin") { 
            Remove-Item -Path "$workspace\opencv\build\bin" -Recurse -Force 
          } else {
            New-Item -ItemType Directory -Force "$workspace\opencv\build\bin" | Out-Null
          }

      # ---- Build & Install OpenCV (with Ninja) ----
      - name: Build & Install OpenCV (with Ninja)
        run: |
          $workspace = "${{ github.workspace }}"
          
          cmake `
            -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DCMAKE_INSTALL_PREFIX=$workspace\opencv\install" `
            -S "$workspace\opencv" `
            -B "$workspace\opencv\build" `
            "-DBUILD_LIST=core,imgproc" `
            "-DBUILD_opencv_apps=OFF" `
            "-DBUILD_SHARED_LIBS=ON" `
            "-DBUILD_TESTS=OFF" `
            "-DBUILD_PERF_TESTS=OFF" `
            "-DBUILD_EXAMPLES=OFF" `
            "-DWITH_JPEG=OFF" `
            "-DWITH_PNG=OFF" `
            "-DWITH_WEBP=OFF" `
            "-DWITH_OPENEXR=OFF" `
            "-DWITH_TIFF=ON" `
            "-DWITH_FFMPEG=OFF" `
            "-DWITH_GSTREAMER=OFF" `
            "-DWITH_OPENCL=OFF" `
            "-DWITH_IPP=OFF" `
            "-DWITH_PROTOBUF=OFF" `
            "-DWITH_QT=OFF" `
            "-DWITH_OPENGL=OFF"

          cmake --build "$workspace\opencv\build" --parallel

          # Clean ALL binaries from build/bin and install directories to avoid stale file errors during install
          Write-Host "Cleaning all executables..."
          
          $binPath = "$workspace\opencv\build\bin"
          if (Test-Path $binPath) { 
            Get-ChildItem -Path $binPath -Filter "*.exe" | Remove-Item -Force 
          }

          $installPath = "$workspace\opencv\install"
          Write-Host "Cleaning installed files..."
          if (Test-Path $installPath) { 
            # Only remove directories and .dll/.lib/.cmake files, not headers or configs
            Get-ChildItem -Path $installPath -Recurse | Where-Object { $_.FullName -like "*\*.exe" } | Remove-Item -Force
          }

          cmake --install "$workspace\opencv\build"

      - name: Prepare NOMACS_DEPENDENCIES (copy to workspace)
        run: |
          $possiblePaths = @(
            "C:\\vcpkg\\installed\\x64-windows",
            "$Env:VCPKG_ROOT\\installed\\x64-windows"
          )
          $src = $null
          foreach ($p in $possiblePaths) {
            if (Test-Path $p) { $src = $p; break }
          }
          if (-not $src) {
            Write-Error "VCPKG dependencies not found in expected locations."
            exit 1
          }
          $dest = "${{ github.workspace }}\\nomacs_deps"
          New-Item -ItemType Directory -Force $dest
          Copy-Item -Recurse -Force "${src}\*" $dest
          echo "NOMACS_DEPENDENCIES=$dest" >> $Env:GITHUB_ENV

      # ---- Configure nomacs (simplified, no pkg-config complexity) ----
      - name: Configure nomacs
        run: |
          $workspace = "${{ github.workspace }}"
          cmake `
             -S ImageLounge `
             -B build `
             -G Ninja `
             "-DCMAKE_BUILD_TYPE=Release" `
             "-DCMAKE_PREFIX_PATH=$workspace\\opencv\\install;$Env:Qt6_ROOT\\..\\" `
             "-DQt6_DIR=$Env:Qt6_ROOT\\lib\\cmake\\Qt6" `
             "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      # ---- Build ----
      - name: Build
        run: cmake --build build

      # ---- Package ----
      - name: Prepare package
        run: |
          $pkg = "package"
          New-Item -ItemType Directory -Force "$pkg" | Out-Null

          Copy-Item build\*.exe "$pkg\"

          windeployqt `
            --release `
            --no-system-d3d-compiler `
            "$pkg/*.exe"
