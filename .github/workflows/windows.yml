name: Windows workflow

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    name: build (windows-msvc)
    env:
      VCPKG_TRIPLET: x64-windows
      VCPKG_DEPENDENCIES: >-
        exiv2:x64-windows libraw:x64-windows vulkan-headers:x64-windows
        pkgconf:x64-windows tiff:x64-windows zlib:x64-windows brotli:x64-windows
        expat:x64-windows openexr:x64-windows libwebp:x64-windows libheif:x64-windows
        dav1d:x64-windows libjxl:x64-windows karchive:x64-windows

    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      # Qt 6.6.2's CMake package files are not compatible with the runner's
      # current CMake 4.4 package-macro behavior.
      - name: Setup compatible CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.29.8"

      - name: Calculate vcpkg cache key
        id: vcpkg-cache-key
        run: |
          $cacheInput = @(
            $Env:VCPKG_TRIPLET
            $Env:VCPKG_DEPENDENCIES
            (vcpkg version | Out-String)
          ) -join "`n"
          $algorithm = [System.Security.Cryptography.SHA256]::Create()
          try {
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($cacheInput)
            $hash = -join ($algorithm.ComputeHash($bytes) | ForEach-Object { $_.ToString('x2') })
          } finally {
            $algorithm.Dispose()
          }
          "key=$hash" >> $Env:GITHUB_OUTPUT

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-binaries-${{ runner.os }}-${{ steps.vcpkg-cache-key.outputs.key }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.2"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"
          modules: qt5compat
          cache: true

      - name: Setup and install vcpkg dependencies
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\vcpkg-binary-cache,readwrite
        run: |
          Write-Host "Installing OpenCV build-time dependencies..."
          $dependencies = $Env:VCPKG_DEPENDENCIES -split '\s+'
          vcpkg install --triplet $Env:VCPKG_TRIPLET @dependencies

      - name: Save vcpkg binary cache
        if: ${{ always() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-binaries-${{ runner.os }}-${{ steps.vcpkg-cache-key.outputs.key }}

      - name: Verify Windows runtime dependencies
        run: |
          $vcpkgExe = (Get-Command vcpkg -CommandType Application).Source
          $vcpkgRoot = Split-Path -Parent $vcpkgExe
          $vcpkgPrefix = Join-Path $vcpkgRoot "installed\$Env:VCPKG_TRIPLET"
          Write-Host "vcpkg executable: $vcpkgExe"
          Write-Host "vcpkg prefix: $vcpkgPrefix"
          cmake --version
          & "$Env:QT_ROOT_DIR\bin\qmake.exe" -v
          Get-Command qmake -All | Select-Object -ExpandProperty Source

          $requiredDlls = @(
            "zlib1.dll", "jpeg62.dll", "brotlicommon.dll", "brotlidec.dll",
            "brotlienc.dll", "exiv2.dll", "libexpat.dll", "lcms2.dll",
            "raw.dll", "opencv_core4130.dll", "opencv_imgproc4130.dll",
            "libsharpyuv.dll", "tiff.dll", "libwebp.dll", "OpenEXR-3_4.dll",
            "IlmThread-3_4.dll", "OpenEXRCore-3_4.dll", "Iex-3_4.dll",
            "Imath-3_2.dll", "heif.dll", "libde265.dll", "openh264-7.dll",
            "openjp2.dll", "avif.dll", "dav1d.dll", "jxl.dll",
            "jxl_threads.dll", "jxl_cms.dll", "KF6Archive.dll"
          )
          $missingDlls = $requiredDlls | Where-Object {
            $dll = Join-Path $vcpkgPrefix "bin\$_"
            if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
              Write-Host "Missing: $dll"
              $true
            }
          }
          if ($missingDlls) {
            throw "The deployment script requires missing vcpkg DLLs: $($missingDlls -join ', ')"
          }

      - name: Set NOMACS_DEPENDENCIES env var
        run: |
          # Use the default vcpkg installation path on the GitHub runner
          $deps = "C:\vcpkg\installed\x64-windows"
          Write-Host "Setting NOMACS_DEPENDENCIES='$deps'"
          echo "NOMACS_DEPENDENCIES=$deps" >> $Env:GITHUB_ENV
        shell: pwsh

      - name: Fetch OpenCV source
        run: |
          Write-Host "Cloning OpenCV..."
          git clone --depth 1 -b 4.13.0 https://github.com/opencv/opencv.git opencv

      - name: Build & Install OpenCV (with Ninja)
        run: |
          cmake `
            -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DCMAKE_INSTALL_PREFIX=opencv\install" `
            -S opencv `
            -B opencv\build `
            "-DBUILD_LIST=core,imgproc" `
            "-DBUILD_opencv_apps=OFF" `
            "-DBUILD_SHARED_LIBS=ON" `
            "-DBUILD_TESTS=OFF" `
            "-DBUILD_PERF_TESTS=OFF" `
            "-DBUILD_EXAMPLES=OFF" `
            "-DWITH_JPEG=OFF" `
            "-DWITH_PNG=OFF" `
            "-DWITH_WEBP=OFF" `
            "-DWITH_OPENEXR=OFF" `
            "-DWITH_TIFF=ON" `
            "-DWITH_FFMPEG=OFF" `
            "-DWITH_GSTREAMER=OFF" `
            "-DWITH_OPENCL=OFF" `
            "-DWITH_IPP=OFF" `
            "-DWITH_PROTOBUF=OFF" `
            "-DWITH_QT=OFF" `
            "-DWITH_OPENGL=OFF"

          cmake --build opencv\build --parallel
          cmake --install opencv\build

      - name: Configure nomacs
        run: |
          cmake `
             -S ImageLounge `
             -B build `
             -G Ninja `
             "-DCMAKE_BUILD_TYPE=Release" `
             "-DOpenCV_DIR=$Env:GITHUB_WORKSPACE\opencv\install" `
             "-DQt6_DIR=$Env:QT_ROOT_DIR\lib\cmake\Qt6" `
             "-DQT_QMAKE_EXECUTABLE=$Env:QT_ROOT_DIR\bin\qmake.exe" `
             "-DVCPKG_PREFER_SYSTEM_LIBS=ON" `
             "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build

      - name: Prepare package
        run: |
          $pkg = "package"
          New-Item -ItemType Directory -Force "$pkg" | Out-Null

          Copy-Item build\*.exe "$pkg\"

          windeployqt `
            --release `
            --no-system-d3d-compiler `
            "$pkg/*.exe"
