name: Windows workflow

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    name: build (windows-msvc)

    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.2"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"
          modules: qt5compat
          dir: ${{ runner.temp }}/qt
          cache: true

      - name: Setup and install vcpkg dependencies
        run: |
          # Write-Host "Installing Qt6 base for vcpkg..."
          # & vcpkg install qt6-base:x64-windows

          Write-Host "Installing OpenCV build-time dependencies..."
          $dependencies = @(
            'exiv2:x64-windows',
            'libraw:x64-windows',
            'vulkan-headers:x64-windows',
            'pkgconf:x64-windows',
            'tiff:x64-windows',
            'zlib:x64-windows',
            'brotli:x64-windows',
            'expat:x64-windows',
            'openexr:x64-windows',
            'libwebp:x64-windows',
            'libheif:x64-windows',
            'dav1d:x64-windows',
            'libjxl:x64-windows',
            'karchive:x64-windows'
          )
          foreach ($dep in $dependencies) {
            Write-Host "Installing: $($dep)"
            & vcpkg install --triplet x64-windows $dep
          }

      - name: Set NOMACS_DEPENDENCIES env var
        run: |
          # Use the default vcpkg installation path on the GitHub runner
          $deps = "C:\vcpkg\installed\x64-windows"
          Write-Host "Setting NOMACS_DEPENDENCIES='$deps'"
          echo "NOMACS_DEPENDENCIES=$deps" >> $Env:GITHUB_ENV
        shell: pwsh

      - name: Fetch OpenCV source
        run: |
          Write-Host "Cloning OpenCV..."
          git clone --depth 1 -b 4.13.0 https://github.com/opencv/opencv.git opencv

      - name: Clean stale artifacts
        run: |
          $workspace = "${{ github.workspace }}"

          Write-Host "Cleaning stale executables from opencv/build/bin..."
          if (Test-Path "$workspace\opencv\build\bin") {
            Remove-Item -Path "$workspace\opencv\build\bin" -Recurse -Force
          } else {
            New-Item -ItemType Directory -Force "$workspace\opencv\build\bin" | Out-Null
          }

      - name: List installed DLLs
        run: |
          Write-Host "NOMACS_DEPENDENCIES='$Env:NOMACS_DEPENDENCIES'"
          $bin = "$Env:NOMACS_DEPENDENCIES\\bin"
          if (Test-Path $bin) {
            Get-ChildItem -Path $bin -File | ForEach-Object { Write-Host "DLL: $($_.FullName)" }
          } else {
            Write-Warning "Directory not found: $bin"
          }
        shell: pwsh

      - name: Print filesystem structure
        run: |
          $workspace = "${{ github.workspace }}"
          Write-Host "Filesystem under ${workspace}:"
          Get-ChildItem -Path $workspace -Recurse -Force | ForEach-Object { Write-Host $_.FullName }
        shell: pwsh
      - name: Build & Install OpenCV (with Ninja)
        run: |
          $workspace = "${{ github.workspace }}"

          cmake `
            -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DCMAKE_INSTALL_PREFIX=$workspace\opencv\install" `
            -S "$workspace\opencv" `
            -B "$workspace\opencv\build" `
            "-DBUILD_LIST=core,imgproc" `
            "-DBUILD_opencv_apps=OFF" `
            "-DBUILD_SHARED_LIBS=ON" `
            "-DBUILD_TESTS=OFF" `
            "-DBUILD_PERF_TESTS=OFF" `
            "-DBUILD_EXAMPLES=OFF" `
            "-DWITH_JPEG=OFF" `
            "-DWITH_PNG=OFF" `
            "-DWITH_WEBP=OFF" `
            "-DWITH_OPENEXR=OFF" `
            "-DWITH_TIFF=ON" `
            "-DWITH_FFMPEG=OFF" `
            "-DWITH_GSTREAMER=OFF" `
            "-DWITH_OPENCL=OFF" `
            "-DWITH_IPP=OFF" `
            "-DWITH_PROTOBUF=OFF" `
            "-DWITH_QT=OFF" `
            "-DWITH_OPENGL=OFF"

          cmake --build "$workspace\opencv\build" --parallel

          # Clean ALL binaries from build/bin and install directories to avoid stale file errors during install
          Write-Host "Cleaning all executables..."

          $binPath = "$workspace\opencv\build\bin"
          if (Test-Path $binPath) {
            Get-ChildItem -Path $binPath -Filter "*.exe" | Remove-Item -Force
          }

          $installPath = "$workspace\opencv\install"
          Write-Host "Cleaning installed files..."
          if (Test-Path $installPath) {
            # Only remove directories and .dll/.lib/.cmake files, not headers or configs
            Get-ChildItem -Path $installPath -Recurse | Where-Object { $_.FullName -like "*\*.exe" } | Remove-Item -Force
          }

          cmake --install "$workspace\opencv\build"

      - name: Configure nomacs
        run: |
          $workspace = "${{ github.workspace }}"
          cmake `
             -S ImageLounge `
             -B build `
             -G Ninja `
             "-DCMAKE_BUILD_TYPE=Release" `
             "-DCMAKE_PREFIX_PATH=$workspace\\opencv\\install;$Env:Qt6_ROOT\\..\\" `
             "-DQt6_DIR=$Env:Qt6_ROOT\\lib\\cmake\\Qt6" `
             "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Clean Release folder
        run: |
          $workspace = "${{ github.workspace }}"
          $releaseDir = "$workspace\\build\\Release"
          if (Test-Path $releaseDir) { Remove-Item -Recurse -Force $releaseDir }
      - name: Build
        run: cmake --build build

      - name: Prepare package
        run: |
          $pkg = "package"
          New-Item -ItemType Directory -Force "$pkg" | Out-Null

          Copy-Item build\*.exe "$pkg\"

          windeployqt `
            --release `
            --no-system-d3d-compiler `
            "$pkg/*.exe"
