name: Windows workflow

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    name: build (windows-msvc)
    env:
      VCPKG_TRIPLET: x64-windows
      VCPKG_DEPENDENCIES: >-
        exiv2:x64-windows libraw:x64-windows vulkan-headers:x64-windows
        pkgconf:x64-windows tiff:x64-windows zlib:x64-windows brotli:x64-windows
        expat:x64-windows openexr:x64-windows libwebp:x64-windows libheif:x64-windows
        dav1d:x64-windows libjxl:x64-windows karchive:x64-windows

    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      # Qt 6.6.2's CMake package files are not compatible with the runner's
      # current CMake 4.4 package-macro behavior.
      - name: Setup compatible CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.29.8"

      - name: Calculate vcpkg cache key
        id: vcpkg-cache-key
        run: |
          $cacheInput = @(
            $Env:VCPKG_TRIPLET
            $Env:VCPKG_DEPENDENCIES
            (vcpkg version | Out-String)
          ) -join "`n"
          $algorithm = [System.Security.Cryptography.SHA256]::Create()
          try {
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($cacheInput)
            $hash = -join ($algorithm.ComputeHash($bytes) | ForEach-Object { $_.ToString('x2') })
          } finally {
            $algorithm.Dispose()
          }
          "key=$hash" >> $Env:GITHUB_OUTPUT

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-binaries-${{ runner.os }}-${{ steps.vcpkg-cache-key.outputs.key }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"
          modules: qt5compat
          cache: true

      # Qt's native Windows package leaves this generated value empty, making
      # the macro call invalid. Host-info discovery is only needed for a
      # cross-build, which this workflow is not.
      - name: Disable Qt host-info lookup for native build
        run: |
          $config = "$Env:QT_ROOT_DIR\lib\cmake\Qt6\Qt6Dependencies.cmake"
          $invalidCall = '_qt_internal_find_host_info_package(${__qt_platform_requires_host_info_package})'
          $content = Get-Content -LiteralPath $config -Raw
          if (-not $content.Contains($invalidCall)) {
            throw "Expected native Qt host-info macro call was not found in $config."
          }
          $content = $content.Replace($invalidCall, '# Host-info package is not required for this native build.')
          Set-Content -LiteralPath $config -Value $content -NoNewline -Encoding utf8

      - name: Setup and install vcpkg dependencies
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\vcpkg-binary-cache,readwrite
        run: |
          Write-Host "Installing OpenCV build-time dependencies..."
          $dependencies = $Env:VCPKG_DEPENDENCIES -split '\s+'
          vcpkg install --triplet $Env:VCPKG_TRIPLET @dependencies

      - name: Save vcpkg binary cache
        if: ${{ always() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-binaries-${{ runner.os }}-${{ steps.vcpkg-cache-key.outputs.key }}

      - name: Fetch OpenCV source
        run: |
          Write-Host "Cloning OpenCV..."
          git clone --depth 1 -b 4.13.0 https://github.com/opencv/opencv.git opencv

      - name: Build & Install OpenCV (with Ninja)
        run: |
          cmake `
            -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DCMAKE_INSTALL_PREFIX=opencv\install" `
            -S opencv `
            -B opencv\build `
            "-DBUILD_LIST=core,imgproc" `
            "-DBUILD_opencv_apps=OFF" `
            "-DBUILD_SHARED_LIBS=ON" `
            "-DBUILD_TESTS=OFF" `
            "-DBUILD_PERF_TESTS=OFF" `
            "-DBUILD_EXAMPLES=OFF" `
            "-DWITH_JPEG=OFF" `
            "-DWITH_PNG=OFF" `
            "-DWITH_WEBP=OFF" `
            "-DWITH_OPENEXR=OFF" `
            "-DWITH_TIFF=ON" `
            "-DWITH_FFMPEG=OFF" `
            "-DWITH_GSTREAMER=OFF" `
            "-DWITH_OPENCL=OFF" `
            "-DWITH_IPP=OFF" `
            "-DWITH_PROTOBUF=OFF" `
            "-DWITH_QT=OFF" `
            "-DWITH_OPENGL=OFF"

          cmake --build opencv\build --parallel
          cmake --install opencv\build

      - name: Assemble NOMACS_DEPENDENCIES runtime prefix
        run: |
          $deps = "$Env:GITHUB_WORKSPACE\runtime-dependencies"
          $bin = "$deps\bin"
          New-Item -ItemType Directory -Force $bin | Out-Null

          $requiredDlls = @(
            "zlib1.dll", "jpeg62.dll", "brotlicommon.dll", "brotlidec.dll",
            "brotlienc.dll", "exiv2.dll", "libexpat.dll", "lcms2.dll",
            "raw.dll", "opencv_core4130.dll", "opencv_imgproc4130.dll",
            "libsharpyuv.dll", "tiff.dll", "libwebp.dll", "OpenEXR-3_4.dll",
            "IlmThread-3_4.dll", "OpenEXRCore-3_4.dll", "Iex-3_4.dll",
            "Imath-3_2.dll", "heif.dll", "libde265.dll", "openh264-7.dll",
            "openjp2.dll", "avif.dll", "dav1d.dll", "jxl.dll",
            "jxl_threads.dll", "jxl_cms.dll", "KF6Archive.dll"
          )
          # The command above invokes C:\vcpkg\vcpkg.exe, which installs the
          # release runtime in its installed tree. VCPKG_ROOT still points at
          # Visual Studio's bundled vcpkg after MSVC setup, so do not use it
          # to discover the artifacts of this invocation.
          $vcpkgBin = "C:\vcpkg\installed\$Env:VCPKG_TRIPLET\bin"
          if (-not (Test-Path -LiteralPath $vcpkgBin -PathType Container)) {
            throw "vcpkg release runtime directory was not found: $vcpkgBin"
          }
          $availableDlls = Get-ChildItem -LiteralPath $vcpkgBin -File -Filter "*.dll"
          # Current vcpkg calls the zlib runtime zlib.dll; the legacy nomacs
          # deployment script expects the historical zlib1.dll filename.
          $sourceNames = @{ "zlib1.dll" = @("zlib1.dll", "zlib.dll") }
          foreach ($dll in $requiredDlls) {
            $source = if ($dll -like "opencv_*.dll") {
              Get-ChildItem "$Env:GITHUB_WORKSPACE\opencv\install\x64\vc18\bin" -File -Filter $dll | Select-Object -First 1
            } else {
              $names = $sourceNames[$dll]
              if (-not $names) { $names = @($dll) }
              $availableDlls | Where-Object { $names -contains $_.Name } | Select-Object -First 1
            }
            if (-not $source) {
              throw "No release runtime DLL found for $dll"
            }
            Copy-Item -LiteralPath $source.FullName -Destination (Join-Path $bin $dll) -Force
          }
          "NOMACS_DEPENDENCIES=$deps" >> $Env:GITHUB_ENV

      - name: Verify Windows runtime dependencies
        run: |
          $requiredDlls = @(
            "zlib1.dll", "jpeg62.dll", "brotlicommon.dll", "brotlidec.dll",
            "brotlienc.dll", "exiv2.dll", "libexpat.dll", "lcms2.dll",
            "raw.dll", "opencv_core4130.dll", "opencv_imgproc4130.dll",
            "libsharpyuv.dll", "tiff.dll", "libwebp.dll", "OpenEXR-3_4.dll",
            "IlmThread-3_4.dll", "OpenEXRCore-3_4.dll", "Iex-3_4.dll",
            "Imath-3_2.dll", "heif.dll", "libde265.dll", "openh264-7.dll",
            "openjp2.dll", "avif.dll", "dav1d.dll", "jxl.dll",
            "jxl_threads.dll", "jxl_cms.dll", "KF6Archive.dll"
          )
          $missingDlls = $requiredDlls | Where-Object {
            -not (Test-Path -LiteralPath "$Env:NOMACS_DEPENDENCIES\bin\$_" -PathType Leaf)
          }
          if ($missingDlls) {
            throw "Missing staged runtime DLLs: $($missingDlls -join ', ')"
          }

      # CMake's legacy file(COPY) calls error on this runner when their
      # destination files do not already exist. Stage the exact deployment
      # layout first; identical files are then skipped by those calls.
      - name: Stage Windows runtime dependencies
        run: |
          $release = "$Env:GITHUB_WORKSPACE\build\Release"
          New-Item -ItemType Directory -Force $release | Out-Null

          $requiredDlls = @(
            "zlib1.dll", "jpeg62.dll", "brotlicommon.dll", "brotlidec.dll",
            "brotlienc.dll", "exiv2.dll", "libexpat.dll", "lcms2.dll",
            "raw.dll", "opencv_core4130.dll", "opencv_imgproc4130.dll",
            "libsharpyuv.dll", "tiff.dll", "libwebp.dll", "OpenEXR-3_4.dll",
            "IlmThread-3_4.dll", "OpenEXRCore-3_4.dll", "Iex-3_4.dll",
            "Imath-3_2.dll", "heif.dll", "libde265.dll", "openh264-7.dll",
            "openjp2.dll", "avif.dll", "dav1d.dll", "jxl.dll",
            "jxl_threads.dll", "jxl_cms.dll", "KF6Archive.dll"
          )
          foreach ($dll in $requiredDlls) {
            Copy-Item -LiteralPath "$Env:NOMACS_DEPENDENCIES\bin\$dll" -Destination $release -Force
          }

          Copy-Item -Path "$Env:GITHUB_WORKSPACE\opencv\install\x64\vc18\bin\*.dll" -Destination $release -Force
          Copy-Item -Path "$Env:QT_ROOT_DIR\bin\Qt6*.dll" -Destination $release -Force
          foreach ($pluginDirectory in "imageformats", "iconengines", "platforms", "styles", "tls") {
            Copy-Item -LiteralPath "$Env:QT_ROOT_DIR\plugins\$pluginDirectory" -Destination $release -Recurse -Force
          }

      - name: Configure nomacs
        run: |
          cmake `
             -S ImageLounge `
             -B build `
             -G Ninja `
             "-DCMAKE_BUILD_TYPE=Release" `
             "-DOpenCV_DIR=$Env:GITHUB_WORKSPACE\opencv\install" `
             "-DQt6_DIR=$Env:QT_ROOT_DIR\lib\cmake\Qt6" `
             "-DQT_QMAKE_EXECUTABLE=$Env:QT_ROOT_DIR\bin\qmake.exe" `
             "-DVCPKG_PREFER_SYSTEM_LIBS=ON" `
             "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build

      - name: Prepare package
        run: |
          $pkg = "package"
          New-Item -ItemType Directory -Force "$pkg" | Out-Null

          Copy-Item build\*.exe "$pkg\"

          windeployqt `
            --release `
            --no-system-d3d-compiler `
            "$pkg/*.exe"
